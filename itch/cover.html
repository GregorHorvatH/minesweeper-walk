<!doctype html>
<html><head><meta charset="utf-8"><title>Cover</title>
<style>
  html,body{margin:0;background:#0d1117}
  svg{display:block;width:630px;height:500px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
</style></head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 500"></svg>
<script>
const NS='http://www.w3.org/2000/svg', svg=document.getElementById('s');
const el=(n,a={},p=svg)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const C=52, COLS=13, ROWS=10, OX=-23, OY=-10;
const cx=c=>OX+c*C, cy=r=>OY+r*C;

// ── поле ──
const path=[[1,4],[2,4],[3,4],[3,5],[4,5],[5,5],[5,4],[6,4],[7,4],[7,5],[7,6],[8,6],[9,6],[10,6],[10,7],[11,7]];
const onPath=new Set(path.map(([c,r])=>c+','+r));
const home=[11,7], start=[1,4], chestAt='5,4';
let seed=11; const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const mines=new Set();
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const k=c+','+r, near=path.some(([pc,pr])=>Math.abs(pc-c)<=0&&Math.abs(pr-r)<=0);
  if(!onPath.has(k)&&rnd()<0.2&&!(c<=2&&r>=3&&r<=5)) mines.add(k);
}
const num=(c,r)=>{let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if((dx||dy)&&mines.has((c+dx)+','+(r+dy)))n++;return n};
const NUMCOL=['','#2f6fd6','#2f9a4a','#d14b4b','#7a3fc0','#b5651d','#1d9a9a','#222','#666'];

for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const x=cx(c),y=cy(r),k=c+','+r;
  if(onPath.has(k)){
    el('rect',{x,y,width:C,height:C,fill:(c===start[0]&&r===start[1])?'#b9d9b6':'#dfe6ee'});
    el('rect',{x:x+.5,y:y+.5,width:C-1,height:C-1,fill:'none',stroke:'#b3c0cf','stroke-width':1});
    const n=num(c,r);
    if(n&&!(c===start[0]&&r===start[1])&&k!==home.join(',')){
      const t=el('text',{x:x+C/2,y:y+C/2+9,'text-anchor':'middle','font-size':26,'font-weight':800,fill:NUMCOL[n]});t.textContent=n;
    }
  } else {
    el('rect',{x,y,width:C,height:C,fill:'#3a4d72'});
    el('rect',{x,y,width:C,height:3,fill:'#465b82'});el('rect',{x,y,width:3,height:C,fill:'#465b82'});
    el('rect',{x,y:y+C-3,width:C,height:3,fill:'#1c2740'});el('rect',{x:x+C-3,y,width:3,height:C,fill:'#1c2740'});
  }
}

// ── фігурки ──
function mine(x,y,s=1){
  const g=el('g',{transform:`translate(${x},${y}) scale(${s})`});
  for(let i=0;i<8;i++){const a=i*Math.PI/4;el('line',{x1:0,y1:0,x2:Math.cos(a)*13,y2:Math.sin(a)*13,stroke:'#0b0e13','stroke-width':3.2,'stroke-linecap':'round'},g)}
  el('circle',{r:9,fill:'#0b0e13'},g);el('circle',{cx:-3,cy:-3,r:2.3,fill:'#fff'},g);
}
function flag(x,y,col='#e5484d'){
  const g=el('g',{transform:`translate(${x},${y})`});
  el('rect',{x:-9,y:12,width:18,height:3,fill:'#222'},g);el('rect',{x:-1,y:-12,width:2.5,height:25,fill:'#222'},g);
  el('polygon',{points:'1,-12 1,2 -13,-5',fill:col},g);
}
function chest(x,y){
  const g=el('g',{transform:`translate(${x},${y}) scale(.9)`});
  el('rect',{x:-21,y:-14,width:42,height:30,rx:4,fill:'#4a2f14'},g);
  el('rect',{x:-19,y:-4,width:38,height:18,fill:'#8b5a2b'},g);
  el('path',{d:'M-19,-4 V-8 Q-19,-12 -11,-12 H11 Q19,-12 19,-8 V-4 Z',fill:'#a86f35'},g);
  el('rect',{x:-19,y:-2,width:38,height:3,fill:'#f2c14e'},g);el('rect',{x:-3,y:-12,width:6,height:26,fill:'#f2c14e'},g);
  el('rect',{x:-3,y:-3,width:6,height:7,fill:'#fff0a8'},g);
}
// міни по краях (ледь видно, наче туман) і прапорці
for(const k of mines){const [c,r]=k.split(',').map(Number); if(rnd()<0.28&&cy(r)>115){ if(rnd()<0.5) flag(cx(c)+C/2,cy(r)+C/2); else mine(cx(c)+C/2,cy(r)+C/2,0.9);} }
// відкриті міни поблизу (трохи інтриги)
mine(cx(4)+C/2,cy(3)+C/2,.9);

// ── туман ──
const defs=el('defs');
const fog=el('radialGradient',{id:'fog',gradientUnits:'userSpaceOnUse',cx:95,cy:228,r:560},defs);
[[0,.0],[.28,.12],[.55,.55],[1,.93]].forEach(([o,a])=>el('stop',{offset:o,'stop-color':'#05080d','stop-opacity':a},fog));
el('rect',{x:0,y:0,width:630,height:500,fill:'url(#fog)'});

// ── хатинка у темряві зі світлими вікнами ──
const hx=cx(home[0]),hy=cy(home[1]);
const hg=el('radialGradient',{id:'hg',gradientUnits:'userSpaceOnUse',cx:hx+C/2,cy:hy+C/2,r:90},defs);
el('stop',{offset:0,'stop-color':'#ffd27a','stop-opacity':.55},hg);el('stop',{offset:1,'stop-color':'#ffd27a','stop-opacity':0},hg);
el('rect',{x:0,y:0,width:630,height:500,fill:'url(#hg)'});
const h=el('g',{transform:`translate(${hx},${hy}) scale(${C/56})`});
el('rect',{x:9,y:24,width:38,height:24,fill:'#d9a45b'},h);el('rect',{x:9,y:44,width:38,height:4,fill:'#b98443'},h);
el('polygon',{points:'4,26 52,26 28,4',fill:'#b5362b'},h);el('rect',{x:37,y:8,width:6,height:12,fill:'#7a4a2a'},h);
el('path',{d:'M22,48 V38 Q22,32 28,32 Q34,32 34,38 V48 Z',fill:'#6b3f1e'},h);
el('rect',{x:12,y:29,width:7,height:7,fill:'#fff3b0'},h);el('rect',{x:37,y:29,width:7,height:7,fill:'#fff3b0'},h);
// дим із димаря
for(let i=0;i<3;i++)el('circle',{cx:hx+C*.7+i*5,cy:hy-4-i*11,r:4+i*2,fill:'#b8c2cc',opacity:.35-i*.08});

// ящик на шляху
chest(cx(5)+C/2,cy(4)+C/2+2);

// ── світло факела ──
const tx=cx(1)+C/2+17, ty=cy(4)+C/2-20;
const tg=el('radialGradient',{id:'tg',gradientUnits:'userSpaceOnUse',cx:tx,cy:ty,r:270},defs);
[[0,.8],[.35,.32],[1,0]].forEach(([o,a])=>el('stop',{offset:o,'stop-color':'#ffa640','stop-opacity':a},tg));
el('rect',{x:0,y:0,width:630,height:500,fill:'url(#tg)','style':'mix-blend-mode:screen'});

// ── персонаж із факелом (як у грі, масштаб 1.35) ──
const px=cx(1)+C/2, py=cy(4)+C/2+6;
const P=el('g',{transform:`translate(${px-20*1.35},${py-24*1.35}) scale(1.35)`});
el('ellipse',{cx:20,cy:47,rx:15,ry:3.5,fill:'#000',opacity:.28},P);
const R=(a,fill)=>el('rect',Object.assign({fill},a),P);
R({x:11,y:36,width:7,height:10},'#3a2f2a');R({x:22,y:36,width:7,height:10},'#3a2f2a');
R({x:8,y:20,width:24,height:20,rx:5},'#2f7de1');R({x:8,y:30,width:24,height:3},'#f2c14e');
R({x:29,y:22,width:7,height:12,rx:3},'#2468bd');
R({x:33,y:16,width:4,height:21},'#6b4423');R({x:31,y:12,width:8,height:8,rx:2},'#2d1d0e');R({x:31,y:15,width:8,height:2},'#4a2f14');
el('circle',{cx:35,cy:33,r:3.6,fill:'#f5cfa0'},P);
el('circle',{cx:35,cy:6,r:8,fill:'#e8541a'},P);el('polygon',{points:'28,4 42,4 35,-11',fill:'#e8541a'},P);
el('circle',{cx:35,cy:7,r:5.5,fill:'#ffb02e'},P);el('polygon',{points:'30.5,5 39.5,5 35,-6',fill:'#ffb02e'},P);
el('circle',{cx:35,cy:8,r:3,fill:'#fff3b0'},P);el('polygon',{points:'32.5,7 37.5,7 35,-1',fill:'#fff3b0'},P);
el('circle',{cx:20,cy:13,r:10,fill:'#f5cfa0'},P);
R({x:8,y:8,width:24,height:4},'#c0392b');R({x:12,y:0,width:16,height:10,rx:4},'#c0392b');
el('circle',{cx:16,cy:14,r:1.6,fill:'#222'},P);el('circle',{cx:24,cy:14,r:1.6,fill:'#222'},P);
// яскрава серцевина полум'я
const fl=el('radialGradient',{id:'fl',gradientUnits:'userSpaceOnUse',cx:tx+2,cy:ty-6,r:60},defs);
el('stop',{offset:0,'stop-color':'#fff1b8','stop-opacity':.8},fl);el('stop',{offset:1,'stop-color':'#ffa640','stop-opacity':0},fl);
el('rect',{x:0,y:0,width:630,height:500,fill:'url(#fl)','style':'mix-blend-mode:screen'});

// ── заголовок ──
const band=el('linearGradient',{id:'band',x1:0,y1:0,x2:0,y2:1},defs);
el('stop',{offset:0,'stop-color':'#05080d','stop-opacity':.92},band);el('stop',{offset:1,'stop-color':'#05080d','stop-opacity':0},band);
el('rect',{x:0,y:0,width:630,height:150,fill:'url(#band)'});
const title=el('text',{x:315,y:74,'text-anchor':'middle','font-size':60,'font-weight':900,fill:'#fff','letter-spacing':-1,
  style:'paint-order:stroke;stroke:#05080d;stroke-width:6px;stroke-linejoin:round'});title.textContent='Minesweeper Walk';
const sub=el('text',{x:315,y:104,'text-anchor':'middle','font-size':19,'font-weight':600,fill:'#ffd27a','letter-spacing':3,
  style:'paint-order:stroke;stroke:#05080d;stroke-width:4px;stroke-linejoin:round'});sub.textContent='FIND THE SAFE ROAD HOME';
// віньєтка
const vg=el('radialGradient',{id:'vg',cx:.5,cy:.5,r:.75},defs);
el('stop',{offset:.6,'stop-color':'#000','stop-opacity':0},vg);el('stop',{offset:1,'stop-color':'#000','stop-opacity':.55},vg);
el('rect',{x:0,y:0,width:630,height:500,fill:'url(#vg)'});
</script></body></html>
